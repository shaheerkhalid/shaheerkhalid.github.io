<!DOCTYPE html>
<html lang="en" data-mode="screen">
<head>
<meta charset="UTF-8">
<title>og-template — SK / CP-01</title>

<!--
  Source for og.png. Not linked from the site and not served to readers;
  it exists so the card can be regenerated when the cover changes.

  Regenerate:
    python3 -m http.server 8791
    node cdp.mjs shot "http://localhost:8791/og-template.html" og.png - 1200 630

  It reuses the real tokens and faces, so the card cannot drift away from
  the document it represents. Inline styles are fine here — this file is a
  build input, never a page under the site's CSP.
-->

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">

<style>
  html, body { background: var(--paper); }
  .card {
    inline-size: 1200px;
    block-size: 630px;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .rule {
    font-family: var(--font-mono);
    font-size: 17px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--stamp);
    display: flex;
    justify-content: space-between;
    border-block-end: 1px solid var(--stamp);
    padding-block-end: 14px;
  }
  h1 {
    font-size: 104px;
    line-height: 1;
    letter-spacing: -0.02em;
    font-weight: 600;
    margin-block-end: 18px;
  }
  .doctype {
    font-family: var(--font-mono);
    font-size: 22px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .foot {
    font-family: var(--font-mono);
    font-size: 17px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-muted);
    display: flex;
    justify-content: space-between;
    gap: 24px;
    border-block-start: 1px solid var(--rule);
    padding-block-start: 14px;
    font-variant-numeric: tabular-nums;
  }
  .stamp {
    position: absolute;
    inset-block-start: 128px;
    inset-inline-end: 72px;
    border: 3px solid var(--stamp);
    color: var(--stamp);
    padding: 10px 18px;
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.3;
    transform: rotate(-7deg);
    opacity: 0.85;
  }
  .stamp span { display: block; font-weight: 400; font-size: 14px; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <div class="card">
    <div class="rule">
      <span>Confidential — named recipient only</span>
      <span>SK / CP-01</span>
    </div>

    <div class="stamp">RECEIVED<span>Rev. 04 · 2026</span></div>

    <div>
      <h1>Shaheer Khalid</h1>
      <p class="doctype">Consultant Profile · Offensive Security</p>
    </div>

    <div class="foot">
      <span>Penetration Tester · OSCP+ · CRTP</span>
      <span>Dubai, UAE</span>
      <span>Rev. 04</span>
    </div>
  </div>
</body>
</html>
